# Name: warehouse dbt project. Profile name matches Compose profile stack naming.
name: 'nexus_clickhouse'
version: '1.0.0'

# Profile in ~/.dbt/profiles.yml (or --profiles-dir). Credentials via env vars only.
profile: 'nexus_clickhouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nexus_clickhouse:
    example:
      +materialized: view
    staging:
      dlt_smoke:
        +schema: stg_dlt_smoke
        +materialized: view
