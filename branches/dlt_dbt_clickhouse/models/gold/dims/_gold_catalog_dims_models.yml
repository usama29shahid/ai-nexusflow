  - name: test_dim_subcategory_initial_load_current
    description: First load opens one active subcategory version and keeps the parent category id.
    model: dim_subcategory
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref("stg_route__subcategories")
        rows:
          - &sub_stg
            subcategory_id: "s1"
