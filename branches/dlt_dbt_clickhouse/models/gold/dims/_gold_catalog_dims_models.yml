            is_active: 1
            is_deleted: 0
            inserted_at: "2026-09-01T00:00:00.000Z"
            updated_at: "2026-09-01T00:00:00.000Z"
      - input: ref("stg_route__brands")
        rows: []
    expect:
      rows:
        - brand_id: "b1"
          dim_brand_sk: "sk_active"
          is_active: 0
          is_deleted: 1
          valid_to: "2026-09-12T12:00:00.000Z"

  - name: test_dim_brand_reappear_after_delete
    description: Brand reappear opens at scd_bound_at.
    model: dim_brand
    overrides:
      macros: *brand_scd_incr
    given:
      - input: this
        rows:
          - dim_brand_sk: "sk_old"
            brand_id: "b1"
            pk_hash: "pk1"
            row_hash: "rh1"
            name: "Canon"
            slug: "canon"
            image: null
            source_created_at: "2026-09-01T00:00:00.000Z"
            source_updated_at: "2026-09-02T00:00:00.000Z"
            run_id: "r_old"
            valid_from: "2026-09-01T00:00:00.000Z"
            valid_to: "2026-09-11T08:00:00.000Z"
            is_active: 0
            is_deleted: 1
            inserted_at: "2026-09-01T00:00:00.000Z"
            updated_at: "2026-09-11T08:00:00.000Z"
      - input: ref("stg_route__brands")
        rows:
          - <<: *brand_stg
            run_id: "r_reappear"
    expect:
      rows:
        - brand_id: "b1"
          run_id: "r_reappear"
          valid_from: "2026-09-12T12:00:00.000Z"
          is_active: 1
          is_deleted: 0

  - name: test_dim_brand_incremental_attribute_change
    description: Brand attribute change expires the prior version and opens a new one.
    model: dim_brand
    overrides:
      macros: *brand_scd_incr
    given:
      - input: this
        rows:
          - dim_brand_sk: "sk_active"
            brand_id: "b1"
            pk_hash: "pk1"
            row_hash: "rh1"
            name: "Canon"
            slug: "canon"
            image: null
            source_created_at: "2026-09-01T00:00:00.000Z"
            source_updated_at: "2026-09-02T00:00:00.000Z"
            run_id: "r_old"
            valid_from: "2026-09-01T00:00:00.000Z"
            valid_to: "9999-01-01T23:59:59.999Z"
            is_active: 1
            is_deleted: 0
            inserted_at: "2026-09-01T00:00:00.000Z"
            updated_at: "2026-09-01T00:00:00.000Z"
      - input: ref("stg_route__brands")
        rows:
          - <<: *brand_stg
            row_hash: "rh2"
            name: "Canon v2"
            run_id: "r_change"
    expect:
      rows:
        - brand_id: "b1"
          row_hash: "rh1"
