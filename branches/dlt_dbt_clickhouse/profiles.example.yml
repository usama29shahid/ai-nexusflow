# Optional. Copy to profiles.yml in this directory if you do not use ~/.dbt
# (profiles.yml is gitignored). dbt does not load the repo .env.
#
#   uv run dbt debug --project-dir branches/dlt_dbt_clickhouse --profiles-dir branches/dlt_dbt_clickhouse

nexus_dbt:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: 8123
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'warehouse') }}"
      secure: false
