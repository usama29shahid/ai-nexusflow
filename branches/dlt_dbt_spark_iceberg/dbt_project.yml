name: 'nexus_lakehouse'
version: '1.0.0'

profile: 'nexus_lakehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nexus_lakehouse:
    staging:
      dlt_smoke:
        +schema: stg_dlt_smoke
        +materialized: view
      route:
        +schema: stg_route
    intermediate:
      +schema: int
    gold:
      +schema: gold
    marts:
      +schema: marts
    published:
      +schema: pub
