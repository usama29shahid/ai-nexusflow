[project]
name = "ai-nexusflow"
version = "0.1.0"
description = "Multi-branch ELT platform with a future LLM generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "dbt-clickhouse>=1.10.2",
    "dbt-core>=1.11.13",
    "dbt-spark[pyhive]>=1.9.0",
    "dlt[clickhouse,s3,pyiceberg]>=1.30.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
