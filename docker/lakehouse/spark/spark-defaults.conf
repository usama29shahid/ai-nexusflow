# Spark Thrift (dbt-spark) + Iceberg REST catalog via Apache Polaris.
# Catalog name must match Polaris and dbt three-level names: nexus_dev.{schema}.{table}

spark.sql.extensions                               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.nexus_dev                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nexus_dev.type                   rest
spark.sql.catalog.nexus_dev.uri                    http://polaris:8181/api/catalog
spark.sql.catalog.nexus_dev.warehouse              nexus_dev
spark.sql.catalog.nexus_dev.rest.auth.type         oauth2
spark.sql.catalog.nexus_dev.oauth2-server-uri      http://polaris:8181/api/catalog/v1/oauth/tokens
spark.sql.catalog.nexus_dev.credential             root:s3cr3t
spark.sql.catalog.nexus_dev.scope                  PRINCIPAL_ROLE:ALL
spark.sql.catalog.nexus_dev.header.Polaris-Realm   POLARIS
spark.sql.catalog.nexus_dev.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nexus_dev.s3.endpoint            http://minio:9000
spark.sql.catalog.nexus_dev.s3.path-style-access   true
spark.sql.catalog.nexus_dev.client.region          us-east-1

spark.sql.defaultCatalog                           nexus_dev

spark.sql.catalogImplementation                    in-memory
