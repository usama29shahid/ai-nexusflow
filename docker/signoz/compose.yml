# SigNoz standalone — profile: signoz
# UI: http://127.0.0.1:${SIGNOZ_UI_PORT:-3301}
# OTLP is internal-only (signoz:4317); host pipelines send to nexus otel-collector.

services:
  signoz:
    image: signoz/signoz-standalone:${SIGNOZ_STANDALONE_VERSION:-latest}
    container_name: signoz
    profiles: [signoz]
    privileged: true
    restart: unless-stopped

    ports:
      - "127.0.0.1:${SIGNOZ_UI_PORT:-3301}:8080"

    expose:
      - "4317"
      - "4318"

    volumes:
      - signoz_data:/var/lib/signoz

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  signoz_data:
