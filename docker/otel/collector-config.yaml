# OTel Collector — lake always; reader exporters injected by
# scripts/render-otel-collector-config.py → .generated/collector-config.yaml
# Env: NEXUS_ENV, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL
# Optional: ZO_ROOT_USER_EMAIL / ZO_ROOT_USER_PASSWORD (OpenObserve Basic auth)
#
# Ops receivers:
# - prometheus/self — collector otelcol_* metrics
# - httpcheck — always-on Compose-DNS probes (service.name = nexusflow.uptime)
# - docker_stats — container CPU/mem/net/IO (docker.sock ro)
# - prometheus/clickhouse — injected when clickhouse profile is up (render script)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol
          scrape_interval: 60s
          static_configs:
            - targets: ["127.0.0.1:8888"]

  docker_stats:
    collection_interval: 60s
    timeout: 20s
    api_version: "1.44"
    metrics:
      container.cpu.utilization:
        enabled: true
      container.cpu.usage.total:
        enabled: true
      container.memory.percent:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true

  # Defaults only on contrib 0.128: httpcheck.status / duration / error
  # Always-on Compose services only — optional profiles omitted so stopped
  # stacks do not flood the lake with failures.
  # prometheus/clickhouse is injected by render-otel-collector-config.py when
  # the clickhouse profile is running (avoids scrape errors when CH is down).
  httpcheck:
    collection_interval: 60s
    targets:
      - method: GET
        endpoints:
          - http://minio:9000/minio/health/live
          - http://otel-collector:13133

processors:
  batch:
  resource/uptime:
    attributes:
      - key: service.name
        value: nexusflow.uptime
        action: upsert

exporters:
  awss3:
    s3uploader:
      region: ${env:AWS_REGION}
      s3_bucket: nexus-telemetry-${env:NEXUS_ENV}
      s3_prefix: otel
      # Avoid default year=%Y/... keys — MinIO rejects some generated object names.
      s3_partition_format: "%Y/%m/%d/%H/%M"
      s3_force_path_style: true
    marshaler: otlp_json

service:
  extensions: [health_check]
  telemetry:
    resource:
      service.name: nexusflow.otel-collector
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: "127.0.0.1"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awss3]
    metrics:
      receivers: [otlp, prometheus/self, docker_stats]
      processors: [batch]
      exporters: [awss3]
    metrics/uptime:
      receivers: [httpcheck]
      processors: [resource/uptime, batch]
      exporters: [awss3]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [awss3]
