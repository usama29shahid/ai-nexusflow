# Profiles: MinIO has none (always starts). Optional stacks:
#   clickhouse — ClickHouse (dlt_dbt_clickhouse)
#   lakehouse  — Spark Thrift, Polaris, Trino (dlt_dbt_spark_iceberg; Milestone 2)
#   airflow    — Airflow (Phase 2)
# Set COMPOSE_PROFILES in .env, or: docker compose --profile clickhouse up -d
services:

  # ============================================================
  # ClickHouse - Data Warehouse  (profile: clickhouse)
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    profiles: [clickhouse]

    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # MinIO - S3 Compatible Object Storage (always on; not a profile)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:
  clickhouse_data:
  clickhouse_logs:
  minio_data: