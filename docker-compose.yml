# Profiles: MinIO has none (always starts). Optional stacks:
#   clickhouse  — ClickHouse (dlt_dbt_clickhouse)
#   lakehouse   — Spark Thrift, Polaris, Trino (dlt_dbt_spark_iceberg)
#   cloudbeaver — CloudBeaver web IDE
#   airflow     — Airflow (on-demand orchestration)
#
# Both branches: COMPOSE_PROFILES=clickhouse,lakehouse in .env
# Airflow: add airflow to COMPOSE_PROFILES or: docker compose --profile airflow up -d
# Python/dlt/dbt run on the host — not in this file.

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.5-python3.12}
  environment: &airflow-common-env
    # Must match Compose `user:` so init chown and runtime UID stay aligned.
    AIRFLOW_UID: ${AIRFLOW_UID:-1000}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    # Required in .env (never empty). ./scripts/setup.sh generates if missing.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?Set AIRFLOW__CORE__FERNET_KEY in .env — run ./scripts/setup.sh or see .env.example}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?Set AIRFLOW__WEBSERVER__SECRET_KEY in .env — run ./scripts/setup.sh or see .env.example}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: minio_logs
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://nexus-airflow-logs-${NEXUS_ENV:-dev}
    AIRFLOW__LOGGING__ENCRYPT_S3_LOGS: "False"
    AIRFLOW_CONN_MINIO_LOGS: >-
      aws://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@/?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=${AWS_REGION:-us-east-1}
    NEXUS_ENV: ${NEXUS_ENV:-dev}
    # Avoid writing __pycache__ into host-owned dags/plugins bind mounts.
    PYTHONDONTWRITEBYTECODE: "1"
    # Official image already includes amazon provider (MinIO S3 remote logs).
    # Do not set _PIP_ADDITIONAL_REQUIREMENTS on airflow-init (runs as root).
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags
    - ./orchestration/airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-1000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:

  # ============================================================
  # ClickHouse — warehouse (profile: clickhouse)
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    profiles: [clickhouse]

    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO — shared object store (always on; not a profile)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO buckets — both capabilities (always; one-shot)
  # ============================================================
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      NEXUS_ENV: ${NEXUS_ENV:-dev}

    volumes:
      - ./docker/minio/init/create-buckets.sh:/create-buckets.sh:ro

    entrypoint: ["/bin/sh", "/create-buckets.sh"]

  # ============================================================
  # Apache Polaris — Iceberg REST catalog (profile: lakehouse)
  # ============================================================
  polaris:
    image: apache/polaris:latest
    container_name: polaris
    restart: unless-stopped
    profiles: [lakehouse]

    ports:
      - "${POLARIS_HTTP_PORT:-8181}:8181"
      - "${POLARIS_MGMT_PORT:-8182}:8182"

    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL_STS: http://minio:9000
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-s3cr3t}"
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      # Local dev: in-memory metastore + auto keys are OK; S3-only (MinIO), no FILE type.
      polaris.readiness.ignore-severe-issues: "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"S3\"]"

    depends_on:
      minio-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ============================================================
  # Polaris bootstrap — catalog nexus_{NEXUS_ENV} (profile: lakehouse)
  # ============================================================
  polaris-setup:
    image: alpine:3.20
    container_name: polaris-setup
    profiles: [lakehouse]
    restart: "no"

    depends_on:
      polaris:
        condition: service_healthy

    environment:
      CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      NEXUS_ENV: ${NEXUS_ENV:-dev}
      POLARIS_CATALOG_NAME: nexus_${NEXUS_ENV:-dev}
      POLARIS_WAREHOUSE_BUCKET: nexus-dlt-dbt-spark-iceberg-${NEXUS_ENV:-dev}
      S3_ENDPOINT_EXTERNAL: http://localhost:${MINIO_API_PORT:-9002}
      S3_ENDPOINT_INTERNAL: http://minio:9000
      AWS_REGION: ${AWS_REGION:-us-east-1}

    volumes:
      - ./docker/lakehouse/polaris:/polaris:ro

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        sh /polaris/bootstrap-catalog.sh
        touch /tmp/polaris-setup-done
        tail -f /dev/null

    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/polaris-setup-done"]
      interval: 2s
      timeout: 5s
      retries: 60

  # ============================================================
  # Spark Thrift — dbt-spark SQL endpoint (profile: lakehouse)
  # ============================================================
  spark-thrift:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    container_name: spark-thrift
    restart: unless-stopped
    profiles: [lakehouse]

    ports:
      - "${SPARK_THRIFT_PORT:-10000}:10000"
      - "${SPARK_UI_PORT:-4040}:4040"

    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MINIO_API_PORT: ${MINIO_API_PORT:-9002}

    volumes:
      - ./docker/lakehouse/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./docker/lakehouse/spark/minio-localhost-proxy.py:/opt/spark/minio-localhost-proxy.py:ro

    depends_on:
      polaris-setup:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        MINIO_API_PORT="${MINIO_API_PORT:-9002}"
        export MINIO_API_PORT
        python3 /opt/spark/minio-localhost-proxy.py &
        proxy_pid=$$!
        for _ in $$(seq 1 30); do
          if bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/$${MINIO_API_PORT}" 2>/dev/null; then
            echo "MinIO proxy listening on 127.0.0.1:$${MINIO_API_PORT}"
            break
          fi
          if ! kill -0 "$${proxy_pid}" 2>/dev/null; then
            echo "MinIO proxy exited before binding port $${MINIO_API_PORT}" >&2
            exit 1
          fi
          sleep 1
        done
        if ! bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/$${MINIO_API_PORT}" 2>/dev/null; then
          echo "MinIO proxy failed to start on port $${MINIO_API_PORT}" >&2
          exit 1
        fi
        /opt/spark/sbin/start-thriftserver.sh \
          --driver-java-options "-Dderby.system.home=/tmp/derby"
        echo "Spark Thrift Server starting; tailing logs..."
        sleep 5
        tail -F /opt/spark/logs/*HiveThriftServer2*.out

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/10000'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

  # ============================================================
  # Trino — BI / SQL on Iceberg (profile: lakehouse)
  # ============================================================
  trino:
    image: trinodb/trino:476
    container_name: trino
    restart: unless-stopped
    profiles: [lakehouse]

    ports:
      - "${TRINO_PORT:-8080}:8080"

    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_REGION: ${AWS_REGION:-us-east-1}

    volumes:
      - ./docker/lakehouse/trino/catalog:/etc/trino/catalog:ro

    depends_on:
      polaris-setup:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================================
  # CloudBeaver — web database IDE (profile: cloudbeaver)
  # ============================================================
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    profiles: [cloudbeaver]

    ports:
      - "127.0.0.1:${CLOUDBEAVER_PORT:-8978}:8978"

    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace

  # ============================================================
  # Airflow — orchestration (profile: airflow, on-demand)
  # ============================================================
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped
    profiles: [airflow]

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    profiles: [airflow]

    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        # Only the named logs volume may be chowned. Never chown bind-mounted
        # dags/plugins — those stay host-owned so developers can add DAGs.
        mkdir -p /sources/logs
        chown -R "${AIRFLOW_UID:-1000}:0" /sources/logs
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env — local default is change-me; do not use on a shared host}
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
    user: "0:0"
    volumes:
      - airflow_logs:/sources/logs
      # dags/plugins are not mounted here — init must not touch host repo trees

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    profiles: [airflow]
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_WEBSERVER_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    profiles: [airflow]
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  cloudbeaver_workspace:
  airflow_postgres_data:
  airflow_logs:
