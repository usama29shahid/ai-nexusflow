cubes:
  - name: categories
    description: Route category dimension (gold dim_category), all SCD2 versions.
    sql: >
      SELECT category_id, name, is_active, is_deleted
      FROM dim_category

    measures:
      - name: category_count
        type: count
        description: Number of current categories.
        filters:
          - sql: "{CUBE}.is_active = 1"

      - name: category_version_count
        type: count
        description: Number of SCD2 version rows for categories.

      - name: category_deleted_count
        type: count
        description: Number of category keys expired by a Pattern A delete.
        filters:
          - sql: "{CUBE}.is_deleted = 1"

    dimensions:
      - name: category_id
        sql: category_id
        type: string

      - name: name
        sql: name
        type: string
